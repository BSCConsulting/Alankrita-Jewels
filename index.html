      rel="stylesheet"
    />
    <!-- Editing this script changes its hash: update the CSP in public/_headers (tests/securityHeaders.test.ts checks). -->
    <script>
      // Apply the persisted theme before first paint to avoid a theme flash.
      try {
        var saved = JSON.parse(localStorage.getItem('ak-theme') || 'null')
        var t = saved && saved.state && saved.state.override
        if (t !== 'heritage' && t !== 'modern') {
          // Keep in sync with the modern-themed collection slugs in src/config/site.ts.
          t = /^\/(admin|collections\/(anti-tarnish-waterproof-jewellery|korean-fashion-accessories))(\/|$)/.test(
            location.pathname,
          )
            ? 'modern'
            : 'heritage'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
